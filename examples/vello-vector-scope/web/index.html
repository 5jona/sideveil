<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Vello 矢量示波器</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 12px; background: transparent; color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; gap: 10px; }
    .shell { flex: 1; display: flex; flex-direction: column; gap: 10px; border-radius: 20px; padding: 14px; background: rgba(10, 15, 28, 0.72); border: 1px solid rgba(148, 163, 184, 0.24); backdrop-filter: blur(18px); }
    .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .title { font-size: 14px; font-weight: 600; }
    .pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,0.09); color: #cbd5e1; font-variant-numeric: tabular-nums; }
    .pill.ok { background: rgba(52, 211, 153, 0.2); color: #6ee7b7; }
    .stage { position: relative; flex: 1; min-height: 160px; border-radius: 14px; overflow: hidden; background: radial-gradient(circle at 20% 20%, rgba(56,189,248,0.12), rgba(15,23,42,0.85)); border: 1px solid rgba(255,255,255,0.1); }
    canvas { width: 100%; height: 100%; display: block; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button { flex: 1; min-width: 84px; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.08); color: #f8fafc; font-size: 12px; cursor: pointer; }
    button.primary { background: var(--accent, #38bdf8); color: var(--accent-fg, #0f172a); border-color: transparent; font-weight: 600; }
  </style>
</head>
<body>
  <div class="shell">
    <div class="head">
      <div class="title">Vello / WebGPU 矢量示波器</div>
      <span id="gpuPill" class="pill">探测 GPU...</span>
    </div>
    <div class="pills">
      <span id="coiPill" class="pill">COI: --</span>
      <span id="sabPill" class="pill">SAB: --</span>
      <span id="cpuPill" class="pill">CPU: --%</span>
      <span id="tempPill" class="pill">SoC: --°C</span>
    </div>
    <div class="stage">
      <canvas id="scopeCanvas"></canvas>
    </div>
    <div class="actions">
      <button id="pinBtn" class="primary">钉选悬浮</button>
      <button id="glassBtn">切换透明/玻璃</button>
      <button id="dismissBtn">关闭</button>
    </div>
  </div>
  <script>
    let port = null;
    let seq = 1;
    let glassMode = false;
    const pending = new Map();
    const samples = Array.from({ length: 48 }, (_, i) => 24 + Math.sin(i * 0.25) * 14);

    function callRpc(method, params) {
      const id = 'vs-' + (seq++);
      const payload = JSON.stringify({ jsonrpc: '2.0', id, method, params });
      return new Promise((resolve, reject) => {
        pending.set(id, { resolve, reject });
        if (port) port.postMessage(payload);
        else if (window.__POCHITA_HOST__) window.__POCHITA_HOST__.postMessage(payload);
        else reject(new Error('no host bridge'));
      });
    }

    function handleIncoming(raw) {
      try {
        const msg = JSON.parse(raw);
        if (msg.id && pending.has(msg.id)) {
          const p = pending.get(msg.id);
          pending.delete(msg.id);
          if (msg.error) p.reject(new Error(msg.error.message));
          else p.resolve(msg.result);
        } else if (msg.event === 'theme.paletteUpdated' && msg.payload?.cssTokens) {
          for (const [k, v] of Object.entries(msg.payload.cssTokens)) {
            if (k.startsWith('--')) document.documentElement.style.setProperty(k, v);
          }
        }
      } catch {}
    }

    window.addEventListener('message', (ev) => {
      if (ev.ports && ev.ports[0] && !port) {
        port = ev.ports[0];
        port.onmessage = (m) => handleIncoming(m.data);
      } else if (typeof ev.data === 'string') {
        handleIncoming(ev.data);
      }
    });

    const coiPill = document.getElementById('coiPill');
    const sabPill = document.getElementById('sabPill');
    const gpuPill = document.getElementById('gpuPill');
    coiPill.textContent = 'COI: ' + (window.crossOriginIsolated ? '隔离就绪' : '关闭');
    if (window.crossOriginIsolated) coiPill.classList.add('ok');
    const hasSab = typeof SharedArrayBuffer !== 'undefined';
    sabPill.textContent = 'SAB: ' + (hasSab ? '可用' : '不可用');
    if (hasSab) sabPill.classList.add('ok');

    async function initRenderer() {
      const canvas = document.getElementById('scopeCanvas');
      let webgpuActive = false;
      if (navigator.gpu) {
        try {
          const adapter = await navigator.gpu.requestAdapter();
          if (adapter) {
            const device = await adapter.requestDevice();
            const ctx = canvas.getContext('webgpu');
            if (ctx) {
              const format = navigator.gpu.getPreferredCanvasFormat();
              ctx.configure({ device, format, alphaMode: 'premultiplied' });
              gpuPill.textContent = 'WebGPU GPU 管线';
              gpuPill.classList.add('ok');
              webgpuActive = true;
              startWebGpuLoop(canvas, device, ctx, format);
            }
          }
        } catch {}
      }
      if (!webgpuActive) {
        gpuPill.textContent = 'Canvas2D 降级';
        startCanvas2dLoop(canvas);
      }
    }

    function startWebGpuLoop(canvas, device, ctx, format) {
      const shader = device.createShaderModule({
        code: `
          struct Uniforms { t: f32, load: f32, pad0: f32, pad1: f32 };
          @group(0) @binding(0) var<uniform> u: Uniforms;
          struct VsOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };
          @vertex fn vs(@builtin(vertex_index) idx: u32) -> VsOut {
            var p = array<vec2f, 3>(vec2f(-1.0,-1.0), vec2f(3.0,-1.0), vec2f(-1.0,3.0));
            var o: VsOut; o.pos = vec4f(p[idx], 0.0, 1.0); o.uv = p[idx] * 0.5 + 0.5; return o;
          }
          @fragment fn fs(i: VsOut) -> @location(0) vec4f {
            let amp = 0.14 + u.load * 0.28;
            let wave = 0.5 + sin(i.uv.x * 10.0 + u.t * 3.2) * amp + cos(i.uv.x * 23.0 - u.t * 2.1) * (amp * 0.35);
            let dist = abs(i.uv.y - wave);
            let line = smoothstep(0.022, 0.004, dist);
            let glow = exp(-dist * 14.0) * 0.45;
            let col = mix(vec3f(0.22, 0.74, 0.97), vec3f(0.95, 0.45, 0.71), i.uv.x);
            let a = clamp(line + glow, 0.0, 1.0);
            return vec4f(col * a, a);
          }
        `,
      });
      const pipeline = device.createRenderPipeline({
        layout: 'auto',
        vertex: { module: shader, entryPoint: 'vs' },
        fragment: { module: shader, entryPoint: 'fs', targets: [{ format }] },
        primitive: { topology: 'triangle-list' },
      });
      const uBuf = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
      const bg = device.createBindGroup({ layout: pipeline.getBindGroupLayout(0), entries: [{ binding: 0, resource: { buffer: uBuf } }] });
      const t0 = performance.now();
      function frame(now) {
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
        const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        const load = (samples[samples.length - 1] || 20) / 100;
        device.queue.writeBuffer(uBuf, 0, new Float32Array([(now - t0) / 1000, load, 0, 0]));
        const enc = device.createCommandEncoder();
        const pass = enc.beginRenderPass({
          colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: { r: 0, g: 0, b: 0, a: 0 }, loadOp: 'clear', storeOp: 'store' }],
        });
        pass.setPipeline(pipeline);
        pass.setBindGroup(0, bg);
        pass.draw(3);
        pass.end();
        device.queue.submit([enc.finish()]);
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function startCanvas2dLoop(canvas) {
      const ctx = canvas.getContext('2d');
      function frame() {
        const dpr = window.devicePixelRatio || 1;
        const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
        const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
        if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
        ctx.clearRect(0, 0, w, h);
        const grad = ctx.createLinearGradient(0, 0, w, 0);
        grad.addColorStop(0, '#38bdf8');
        grad.addColorStop(0.6, '#818cf8');
        grad.addColorStop(1, '#f472b6');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 2.5 * dpr;
        ctx.beginPath();
        samples.forEach((v, idx) => {
          const x = (idx / (samples.length - 1)) * w;
          const y = h - (Math.min(100, Math.max(0, v)) / 100) * h * 0.8 - h * 0.1;
          if (idx === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    setInterval(async () => {
      try {
        const snap = await callRpc('telemetry.snapshot');
        if (snap && typeof snap.cpuPercent === 'number') {
          samples.shift();
          samples.push(snap.cpuPercent);
          document.getElementById('cpuPill').textContent = 'CPU: ' + snap.cpuPercent.toFixed(1) + '%';
          document.getElementById('tempPill').textContent = 'SoC: ' + (snap.socTempC != null ? snap.socTempC.toFixed(0) + '°C' : '--');
        }
      } catch {}
    }, 600);

    document.getElementById('pinBtn').onclick = () => {
      callRpc('haptics.trigger', { kind: 'click' }).catch(() => {});
      callRpc('container.action', { type: 'setPresentationMode', mode: 'pinned' }).catch(() => {});
    };
    document.getElementById('glassBtn').onclick = () => {
      glassMode = !glassMode;
      callRpc('haptics.trigger', { kind: 'tick' }).catch(() => {});
      callRpc('container.action', { type: 'setSurfaceBackdrop', backdrop: glassMode ? 'native-glass' : 'transparent' }).catch(() => {});
    };
    document.getElementById('dismissBtn').onclick = () => {
      callRpc('container.action', { type: 'dismiss' }).catch(() => {});
    };

    void initRenderer();
  </script>
</body>
</html>
