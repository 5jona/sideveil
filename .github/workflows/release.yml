name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Archive tag label for manual builds (defaults to git describe)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish KernelSU Archives
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: "${{ github.workspace }}/hub/scripts/aarch64-android-linker.sh"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain (with aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: hub

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Install Android SDK & NDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using sdkmanager: ${SDKMANAGER} (SDK_ROOT=${SDK_ROOT})"
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;30.0.16248370"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_NDK_HOME=${SDK_ROOT}/ndk/30.0.16248370" >> "${GITHUB_ENV}"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="$(git describe --tags --always 2>/dev/null || echo v0.0.0-dispatch)"
          fi
          echo "RELEASE_TAG=${TAG}" >> "${GITHUB_ENV}"
          echo "Resolved release tag: ${TAG}"

      - name: Configure Android Release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            if [ -z "${ANDROID_KEYSTORE_PASSWORD}" ] || [ -z "${ANDROID_KEY_ALIAS}" ] || [ -z "${ANDROID_KEY_PASSWORD}" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, or ANDROID_KEY_PASSWORD is missing." >&2
              exit 1
            fi
            KEYSTORE_PATH="${RUNNER_TEMP}/sideveil-release.jks"
            printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
            chmod 0600 "${KEYSTORE_PATH}"
            {
              echo "KEYSTORE_FILE=${KEYSTORE_PATH}"
              echo "KEYSTORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
              echo "KEY_ALIAS=${ANDROID_KEY_ALIAS}"
              echo "KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
              echo "REQUIRE_RELEASE_KEYSTORE=true"
            } >> "${GITHUB_ENV}"
            echo "Configured Android release keystore at ${KEYSTORE_PATH}."
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "::error::Tagged release builds (${GITHUB_REF}) require ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets." >&2
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is empty; continuing workflow_dispatch build with debug signing fallback."
          fi

      - name: Build release archive
        run: |
          set -euo pipefail
          mkdir -p release-assets
          bash build.sh --mode release
          cp out/sideveil.zip "release-assets/sideveil-${RELEASE_TAG}.zip"

      - name: Build debug archive
        run: |
          set -euo pipefail
          bash build.sh --mode debug
          cp out/sideveil.zip "release-assets/sideveil-${RELEASE_TAG}-debug.zip"

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum \
              "sideveil-${RELEASE_TAG}.zip" \
              "sideveil-${RELEASE_TAG}-debug.zip" \
              > SHA256SUMS.txt
          )
          cat release-assets/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sideveil-${{ env.RELEASE_TAG }}
          path: release-assets/

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              "release-assets/sideveil-${RELEASE_TAG}.zip" \
              "release-assets/sideveil-${RELEASE_TAG}-debug.zip" \
              "release-assets/SHA256SUMS.txt" \
              --clobber
          else
            gh release create "${RELEASE_TAG}" \
              "release-assets/sideveil-${RELEASE_TAG}.zip" \
              "release-assets/sideveil-${RELEASE_TAG}-debug.zip" \
              "release-assets/SHA256SUMS.txt" \
              --title "SideVeil ${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/sideveil-release.jks"
