name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  contracts-and-webui:
    name: Contracts & WebUI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.22.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webui/pnpm-lock.yaml

      - name: Verify version parity and changelog
        run: node scripts/bump-version.mjs --check

      - name: Install WebUI dependencies
        run: pnpm --dir webui install --frozen-lockfile

      - name: Check contracts and validate golden fixtures
        run: |
          set -euo pipefail
          CLI=webui/node_modules/.bin/pochita-contracts-gen
          "$CLI" check \
            contracts/protocol-constants.contract.json \
            contracts/config-bounds.contract.json \
            contracts/protocol-wire.contract.json \
            contracts/theme-hud.contract.json \
            contracts/plugin-manifest.contract.json
          "$CLI" validate-fixtures contracts/schemas/config.schema.json contracts/fixtures/config
          "$CLI" validate-fixtures contracts/schemas/protocol-status.schema.json contracts/fixtures/status
          "$CLI" validate-fixtures contracts/schemas/protocol-events.schema.json contracts/fixtures/events
          "$CLI" validate-fixtures contracts/schemas/protocol-theme-hud.schema.json contracts/fixtures/theme-hud
          "$CLI" validate-fixtures contracts/schemas/plugin-manifest.schema.json contracts/fixtures/plugin-manifest

      - name: Check WebUI (lint, typecheck, build, test)
        run: pnpm --dir webui check

      - name: Upload panel WebUI assets
        uses: actions/upload-artifact@v4
        with:
          name: panel-assets
          path: android/host-app/src/main/assets/panel/
          if-no-files-found: error
          retention-days: 1

  hub-rust:
    name: Hub & Example Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hub
            examples/native-perf-hud

      - name: Check hub workspace
        working-directory: hub
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Check native-perf-hud example crate
        working-directory: examples/native-perf-hud
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

  android:
    name: Android Protocol, Sensor & Host
    needs: contracts-and-webui
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Install Android SDK components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)"
          echo "Using sdkmanager: ${SDKMANAGER} (SDK_ROOT=${SDK_ROOT})"
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses >/dev/null || true
          "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --install "platforms;android-37.0" "build-tools;36.0.0"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "${GITHUB_ENV}"

      - name: Download panel WebUI assets
        uses: actions/download-artifact@v4
        with:
          name: panel-assets
          path: android/host-app/src/main/assets/panel/

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android checks and build sensor DEX
        working-directory: android
        run: |
          ./gradlew spotlessCheck detekt :host-app:lintDebug :protocol:test :sensor:test :host-app:testDebugUnitTest :sensor:buildDex
