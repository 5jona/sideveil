[tools]
android-sdk = "23.0"
java = "25"
pnpm = "12.22.0"

[env]
CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER = "{{config_root}}/hub/scripts/aarch64-android-linker.sh"

[task_config]
dir = "{{config_root}}"

[tasks.build]
description = "Build Rust hub binaries, WebUI bundles, sensor DEX, host APK, and KernelSU ZIP archive"
run = "bash build.sh"

[tasks.reload]
description = "Build and hot-reload SideVeil onto Android device via container SSH or on-device host-exec"
run = "bash reload.sh"

[tasks."reload:fast"]
description = "Skip full build and hot-reload existing SideVeil artifacts (forwards extra flags like --hub-only / --ssh)"
run = "bash reload.sh --skip-build"

[tasks."verify:live"]
description = "Run live end-to-end SideVeil verification harness (supports --ssh, --mode, --report-json)"
run = "python3 scripts/verify-live.py"

[tasks."webui:check"]
description = "Lint, typecheck, test, and build Control Plane and Panel WebUIs"
dir = "{{config_root}}/webui"
run = "pnpm check"

[tasks."webui:format"]
description = "Format and auto-fix WebUI files with Biome"
dir = "{{config_root}}/webui"
run = "pnpm format"

[tasks."android:check"]
description = "Run Spotless, Detekt, Android Lint, JVM unit tests, sensor DEX build, and release APK build"
dir = "{{config_root}}/android"
run = "./gradlew spotlessCheck detekt :host-app:lintDebug :protocol:test :sensor:test :host-app:testDebugUnitTest :sensor:buildDex :host-app:assembleRelease"

[tasks."android:format"]
description = "Format Kotlin, Gradle, and config files with Spotless"
dir = "{{config_root}}/android"
run = "./gradlew spotlessApply"

[tasks."hub:check"]
description = "Run Rust fmt check, clippy (-D warnings), and workspace unit tests (including bundled example daemons)"
dir = "{{config_root}}/hub"
run = "cargo fmt --check && cargo clippy --workspace --all-targets -- -D warnings && cargo test --workspace && cargo fmt --manifest-path ../examples/native-perf-hud/Cargo.toml --check && cargo clippy --manifest-path ../examples/native-perf-hud/Cargo.toml --all-targets -- -D warnings && cargo test --manifest-path ../examples/native-perf-hud/Cargo.toml"

[tasks."hub:format"]
description = "Format Rust workspace with rustfmt"
dir = "{{config_root}}/hub"
run = "cargo fmt --all && cargo fmt --manifest-path ../examples/native-perf-hud/Cargo.toml"

[tasks."hub:build"]
description = "Cross-compile Rust hub binaries and HUD JNI cdylib for aarch64-linux-android"
dir = "{{config_root}}/hub"
run = "cargo build --release --target aarch64-linux-android -p sideveild -p sideveil-ctl -p sideveil-hud-jni"

[tasks."examples:build"]
description = "Cross-compile standalone native-perf-hud example plugin daemon for aarch64-linux-android"
dir = "{{config_root}}/examples/native-perf-hud"
run = "cargo build --release --target aarch64-linux-android"

[tasks.check]
description = "Run all Rust, WebUI, and Android quality gates"
run = "mise run hub:check && mise run webui:check && mise run android:check"

[tasks.clean]
description = "Clean Gradle, Rust, and WebUI build outputs"
run = "rm -rf out webroot bin/sideveild bin/sideveil-ctl bin/sideveil-example-perf-hud bin/sideveil-sensor.dex system/priv-app/SideVeilHost/SideVeilHost.apk android/host-app/src/main/assets/panel android/host-app/src/main/jniLibs examples/vello-vector-scope/web examples/native-perf-hud/web hub/target examples/native-perf-hud/target && cd android && ./gradlew clean"
