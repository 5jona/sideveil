[workspace]
resolver = "3"
members = [
    "crates/sideveil-protocol",
    "crates/sideveil-plugin-sdk",
    "crates/sideveil-gfx",
    "crates/sideveil-hud-jni",
    "crates/sideveild",
    "crates/sideveil-ctl",
]
default-members = ["crates/sideveild", "crates/sideveil-ctl"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"

[workspace.dependencies]
crc32fast = "1"
data-encoding = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = [
    "sink",
    "std",
] }
jni-sys = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sideveil-gfx = { path = "crates/sideveil-gfx" }
sideveil-plugin-sdk = { path = "crates/sideveil-plugin-sdk" }
sideveil-protocol = { path = "crates/sideveil-protocol" }
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-tungstenite = { version = "0.30", default-features = false, features = [
    "handshake",
] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
usvg = { version = "0.50", default-features = false }
vello_cpu = { version = "0.4", default-features = false, features = [
    "std",
    "png",
    "u8_pipeline",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
mod_module_files = "warn"
undocumented_unsafe_blocks = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
manual_let_else = "warn"
explicit_iter_loop = "warn"
redundant_closure_for_method_calls = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"
expect_used = "warn"
await_holding_lock = "warn"
redundant_clone = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3
