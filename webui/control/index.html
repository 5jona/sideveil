<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230066ff'/%3E%3Crect x='36' y='14' width='14' height='36' rx='7' fill='white' fill-opacity='0.94'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var scheme = localStorage.getItem('pochita:color-scheme');
        if (scheme === 'light' || scheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = scheme;
        }
        var theme = localStorage.getItem('pochita:theme');
        if (theme === 'coloros-glass' || theme === 'modern-saas-dark') {
          document.documentElement.dataset.theme = theme;
        } else {
          document.documentElement.dataset.theme = 'coloros-glass';
        }
      } catch (e) {}
    </script>
    <title>Sideveil 侧边栏控制台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
